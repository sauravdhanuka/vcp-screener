services:
  - type: web
    name: vcp-screener-dashboard
    env: docker
    plan: starter # You can use free/starter plan
    region: singapore # Closest to NSE (or frankfurt/oregon)
    healthCheckPath: /
    envVars:
      - key: VCP_TELEGRAM_BOT_TOKEN
        sync: false # Set this manually in Render Dashboard
      - key: VCP_TELEGRAM_CHAT_ID
        sync: false # Set this manually in Render Dashboard
    disk:
      name: vcp-data
      mountPath: /app/data
      sizeGB: 1
