{% extends "base.html" %}
{% block title %}Signals — VCP Screener{% endblock %}
{% block content %}
<div class="max-w-4xl">
  {# Header #}
  <div class="flex items-center justify-between mb-4">
    <h1 class="text-xl font-bold text-white">Signals</h1>
  </div>

  {# Tab buttons #}
  <div class="flex gap-1 mb-4 border-b border-bg-border" data-tab-group="signals">
    <button data-tab="vcp"
            hx-get="/partials/signals?view=vcp"
            hx-target="#signal-content"
            hx-swap="innerHTML"
            onclick="switchTab('signals', 'vcp')"
            class="px-4 py-2 text-sm font-medium border-b-2 transition-colors border-accent-blue text-white">
      VCP Signals
    </button>
    <button data-tab="mr"
            hx-get="/partials/signals?view=mr"
            hx-target="#signal-content"
            hx-swap="innerHTML"
            onclick="switchTab('signals', 'mr')"
            class="px-4 py-2 text-sm font-medium border-b-2 transition-colors border-transparent text-text-muted">
      MR Signals
    </button>
  </div>

  {# Signal content area — initial load is VCP #}
  <div id="signal-content">
    {% include "partials/signal_list.html" %}
  </div>
</div>
{% endblock %}
