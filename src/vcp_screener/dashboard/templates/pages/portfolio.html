{% extends "base.html" %}
{% block title %}Portfolio — VCP Screener{% endblock %}
{% block content %}

<!-- Header -->
<div class="flex items-center gap-4 mb-6">
    <h1 class="text-xl font-bold text-white">Portfolio</h1>
</div>

<!-- Tab bar -->
<div data-tab-group="portfolio" class="mb-6">
    <div class="flex gap-1 border-b border-bg-border">
        <button data-tab="holdings"
                hx-get="/partials/holdings" hx-target="#portfolio-content" hx-swap="innerHTML"
                onclick="switchTab('portfolio', 'holdings')"
                class="px-4 py-2 text-sm font-medium border-b-2 transition-colors border-accent-blue text-white">
            Holdings
        </button>
        <button data-tab="alerts"
                hx-get="/partials/sell-alerts" hx-target="#portfolio-content" hx-swap="innerHTML"
                onclick="switchTab('portfolio', 'alerts')"
                class="px-4 py-2 text-sm font-medium border-b-2 transition-colors border-transparent text-text-muted hover:text-white">
            Sell Alerts
            {% if alerts|length > 0 %}
                <span class="ml-1 px-1.5 py-0.5 text-xs rounded-full bg-accent-red/20 text-accent-red">{{ alerts|length }}</span>
            {% endif %}
        </button>
        <button data-tab="history"
                hx-get="/partials/trade-history" hx-target="#portfolio-content" hx-swap="innerHTML"
                onclick="switchTab('portfolio', 'history')"
                class="px-4 py-2 text-sm font-medium border-b-2 transition-colors border-transparent text-text-muted hover:text-white">
            Trade History
        </button>
        <button data-tab="buy"
                hx-get="/partials/buy-form" hx-target="#portfolio-content" hx-swap="innerHTML"
                onclick="switchTab('portfolio', 'buy')"
                class="px-4 py-2 text-sm font-medium border-b-2 transition-colors border-transparent text-text-muted hover:text-white">
            New Position
        </button>
    </div>
</div>

<!-- Tab content -->
<div id="portfolio-content">
    {% include "partials/holdings_list.html" %}
</div>

{% endblock %}
