<!-- Buy form partial -->
<div class="bg-bg-card border border-bg-border rounded-lg p-6">
    <h3 class="text-sm font-semibold text-white mb-4">Record New Position</h3>

    {% if error %}
    <div class="mb-4 px-4 py-3 rounded-lg text-sm font-medium"
         style="background: #5c1a1a; border: 1px solid #f85149; color: #f85149;">
        {{ error }}
    </div>
    {% endif %}

    <form hx-post="/api/portfolio/buy"
          hx-target="#portfolio-content"
          hx-swap="innerHTML"
          class="space-y-4">

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <!-- Column 1 -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-text-muted uppercase tracking-wider mb-1" for="buy-symbol">Symbol</label>
                    <input type="text" name="symbol" id="buy-symbol" required
                           placeholder="e.g. RELIANCE"
                           class="w-full px-3 py-2 rounded-md bg-bg border border-bg-border text-text text-sm
                                  focus:border-accent-blue focus:outline-none focus:ring-1 focus:ring-accent-blue/50">
                </div>
                <div>
                    <label class="block text-xs text-text-muted uppercase tracking-wider mb-1" for="buy-strategy">Strategy</label>
                    <select name="strategy" id="buy-strategy"
                            class="w-full px-3 py-2 rounded-md bg-bg border border-bg-border text-text text-sm
                                   focus:border-accent-blue focus:outline-none focus:ring-1 focus:ring-accent-blue/50">
                        <option value="vcp">VCP</option>
                        <option value="mean_reversion">Mean Reversion</option>
                    </select>
                </div>
            </div>

            <!-- Column 2 -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-text-muted uppercase tracking-wider mb-1" for="buy-entry">Entry Price</label>
                    <input type="number" name="entry_price" id="buy-entry" required
                           min="0.01" step="0.01"
                           placeholder="0.00"
                           class="w-full px-3 py-2 rounded-md bg-bg border border-bg-border text-text text-sm
                                  focus:border-accent-blue focus:outline-none focus:ring-1 focus:ring-accent-blue/50">
                </div>
                <div>
                    <label class="block text-xs text-text-muted uppercase tracking-wider mb-1" for="buy-stop">Stop Loss (0 = auto)</label>
                    <input type="number" name="stop_loss" id="buy-stop"
                           min="0" step="0.01" value="0"
                           class="w-full px-3 py-2 rounded-md bg-bg border border-bg-border text-text text-sm
                                  focus:border-accent-blue focus:outline-none focus:ring-1 focus:ring-accent-blue/50">
                </div>
            </div>

            <!-- Column 3 -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-text-muted uppercase tracking-wider mb-1" for="buy-shares">Shares (0 = auto)</label>
                    <input type="number" name="shares" id="buy-shares"
                           min="0" step="1" value="0"
                           class="w-full px-3 py-2 rounded-md bg-bg border border-bg-border text-text text-sm
                                  focus:border-accent-blue focus:outline-none focus:ring-1 focus:ring-accent-blue/50">
                </div>
                <div>
                    <label class="block text-xs text-text-muted uppercase tracking-wider mb-1" for="buy-pivot">Pivot Price (optional)</label>
                    <input type="number" name="pivot_price" id="buy-pivot"
                           min="0" step="0.01" value="0"
                           class="w-full px-3 py-2 rounded-md bg-bg border border-bg-border text-text text-sm
                                  focus:border-accent-blue focus:outline-none focus:ring-1 focus:ring-accent-blue/50">
                </div>
            </div>
        </div>

        <div class="pt-2">
            <button type="submit"
                    class="px-6 py-2 bg-accent-blue/20 text-accent-blue border border-accent-blue/40 rounded-md text-sm font-medium
                           hover:bg-accent-blue/30 transition-colors flex items-center gap-2">
                <span class="htmx-indicator spinner"></span>
                Buy
            </button>
        </div>
    </form>
</div>
